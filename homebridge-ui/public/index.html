<style>
  #hih { --gap: 12px; font-size: 15px; }

  #hih h5 { margin: 0 0 10px; font-weight: 600; }
  #hih .row-flex { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #hih .grow { flex: 1 1 180px; min-width: 0; }
  #hih .muted { opacity: .7; font-size: 13px; }
  #hih .phrase { border: 1px solid rgba(128,128,128,.3); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  #hih .phrase textarea { width: 100%; min-height: 54px; resize: vertical; }
  #hih .chips label { border: 1px solid rgba(128,128,128,.45); border-radius: 16px; padding: 3px 10px; margin: 0; cursor: pointer; user-select: none; }
  #hih .chips input { margin-inline-end: 5px; }
  #hih .badge-state { font-size: 13px; padding: 4px 10px; border-radius: 12px; }
  #hih .st-ready { background: #2e7d32; color: #fff; }
  #hih .st-installing, #hih .st-missing { background: #f9a825; color: #000; }
  #hih .st-error { background: #c62828; color: #fff; }
  #hih .lang button { min-width: 74px; }
  #hih details summary { cursor: pointer; font-weight: 600; }
  #hih .scan-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed rgba(128,128,128,.3); }
  #hih input[type=range] { width: 140px; vertical-align: middle; }
  #hih .phrase.urgent { border-color: #c62828; box-shadow: inset 4px 0 0 #c62828; }
  #hih .tip { border: 1px dashed #f9a825; border-radius: 10px; padding: 10px; background: rgba(249,168,37,.08); }
</style>

<div id="hih" dir="rtl">
  <div class="row-flex" style="justify-content: space-between; margin-bottom: 12px;">
    <div>
      <h4 style="margin:0" data-t="title"></h4>
      <div class="muted" data-t="subtitle"></div>
    </div>
    <div class="row-flex">
      <span id="engineState" class="badge-state"></span>
      <button id="installBtn" class="btn btn-sm btn-warning" style="display:none" data-t="install"></button>
      <div class="btn-group lang">
        <button type="button" class="btn btn-sm" data-lang="he">עברית</button>
        <button type="button" class="btn btn-sm" data-lang="en">English</button>
      </div>
    </div>
  </div>

  <!-- What's new (shown once after an update) -->
  <div id="whatsNew" class="card tip" style="display:none">
    <h5 id="wnTitle"></h5>
    <ul id="wnList" style="margin:0 0 8px; padding-inline-start:20px"></ul>
    <button id="wnOk" class="btn btn-sm btn-primary" data-t="wnOk"></button>
  </div>

  <!-- Default voice -->
  <div class="card">
    <h5 data-t="voiceTitle"></h5>
    <div class="row-flex">
      <select id="defaultVoice" class="form-control grow"></select>
      <select id="defaultStyle" class="form-control grow"></select>
      <button id="previewVoice" class="btn btn-outline-primary btn-sm" data-t="preview"></button>
    </div>
    <div class="muted" style="margin-top:6px" data-t="voiceHelp"></div>
    <div id="geminiTip" class="tip" style="margin-top:10px">
      <b data-t="geminiTipTitle"></b><br>
      <span data-t="geminiTipText"></span>
      <a href="https://aistudio.google.com/apikey" target="_blank" data-t="geminiTipLink"></a>
      <div class="row-flex" style="margin-top:6px">
        <input id="geminiKey" type="password" class="form-control grow" autocomplete="off" data-ph="geminiKey">
      </div>
    </div>

    <details style="margin-top:12px">
      <summary data-t="premiumTitle"></summary>
      <div class="muted" style="margin:6px 0" data-t="premiumHelp"></div>
      <label data-t="elKey"></label>
      <input id="elKey" type="password" class="form-control" autocomplete="off">
      <label data-t="elVoice" style="margin-top:6px"></label>
      <input id="elVoice" type="text" class="form-control" autocomplete="off">
      <label data-t="gKey" style="margin-top:6px"></label>
      <input id="gKey" type="password" class="form-control" autocomplete="off">
      <label data-t="oaKey" style="margin-top:6px"></label>
      <input id="oaKey" type="password" class="form-control" autocomplete="off" placeholder="sk-...">
      <div class="muted" data-t="oaHelp"></div>
      <label data-t="caKey" style="margin-top:6px"></label>
      <div class="row-flex">
        <input id="caKey" type="password" class="form-control grow" autocomplete="off" placeholder="sk_car_...">
        <button id="caLoad" class="btn btn-sm btn-outline-primary" data-t="caLoad"></button>
      </div>
      <div class="muted" data-t="caHelp"></div>
      <div id="caList" style="margin-top:6px"></div>
      <div class="form-check" style="margin-top:8px">
        <input id="fallback" type="checkbox" class="form-check-input">
        <label for="fallback" class="form-check-label" data-t="fallback"></label>
      </div>
    </details>
  </div>

  <!-- General settings -->
  <div class="card">
    <h5 data-t="generalTitle"></h5>

    <div class="form-check">
      <input id="qEnabled" type="checkbox" class="form-check-input">
      <label for="qEnabled" class="form-check-label" data-t="qEnabled"></label>
    </div>
    <div id="qBox" style="margin:6px 0 4px">
      <div class="row-flex">
        <span data-t="qFrom"></span><input id="qStart" type="time" class="form-control" style="max-width:130px" dir="ltr">
        <span data-t="qTo"></span><input id="qEnd" type="time" class="form-control" style="max-width:130px" dir="ltr">
        <select id="qMode" class="form-control" style="max-width:200px">
          <option value="lower" data-t="qLower"></option>
          <option value="mute" data-t="qMute"></option>
        </select>
        <span id="qVolWrap"><input id="qVolume" type="range" min="0" max="100"> <span id="qVolV"></span></span>
      </div>
      <div class="muted" style="margin-top:4px" data-t="qHelp"></div>
    </div>

    <div class="form-check" style="margin-top:12px">
      <input id="cEnabled" type="checkbox" class="form-check-input">
      <label for="cEnabled" class="form-check-label" data-t="cEnabled"></label>
    </div>
    <div id="cBox" class="row-flex" style="margin:6px 0 4px">
      <select id="cSound" class="form-control" style="max-width:180px">
        <option value="dingdong" data-t="cDingdong"></option>
        <option value="soft" data-t="cSoft"></option>
      </select>
      <span data-t="cUrgentLabel"></span>
      <select id="cUrgent" class="form-control" style="max-width:180px">
        <option value="urgent" data-t="cUrgentBeeps"></option>
        <option value="same" data-t="cSame"></option>
        <option value="none" data-t="cNone"></option>
      </select>
      <button id="cTest" class="btn btn-sm btn-outline-primary" data-t="preview"></button>
    </div>

    <div class="form-check" style="margin-top:12px">
      <input id="aEnabled" type="checkbox" class="form-check-input">
      <label for="aEnabled" class="form-check-label" data-t="aEnabled"></label>
    </div>
    <div id="aBox" style="margin:6px 0 0">
      <div class="row-flex"><span data-t="aEvery"></span><input id="aInterval" type="number" min="1" max="60" class="form-control" style="max-width:90px"></div>
      <div class="muted" style="margin-top:4px" data-t="aHelp"></div>
    </div>
  </div>

  <!-- HomePods -->
  <div class="card">
    <h5 data-t="speakersTitle"></h5>
    <div id="speakers"></div>
    <div class="row-flex" style="margin-top:8px">
      <button id="scanBtn" class="btn btn-primary btn-sm" data-t="scan"></button>
      <button id="addSpeakerBtn" class="btn btn-outline-secondary btn-sm" data-t="addManual"></button>
    </div>
    <div id="scanResults" style="margin-top:10px"></div>
  </div>

  <!-- Phrases -->
  <div class="card">
    <h5 data-t="phrasesTitle"></h5>
    <div class="muted" style="margin-bottom:8px" data-t="phrasesHelp"></div>
    <div id="phrases"></div>
    <button id="addPhraseBtn" class="btn btn-primary btn-sm" data-t="addPhrase"></button>
    <div class="form-check" style="margin-top:12px">
      <input id="groupSwitches" type="checkbox" class="form-check-input">
      <label for="groupSwitches" class="form-check-label" data-t="groupSwitches"></label>
    </div>
    <div id="groupBox" style="display:none; margin-top:6px">
      <label data-t="groupName"></label>
      <input id="groupName" type="text" class="form-control">
      <div class="muted" style="margin-top:4px" data-t="groupHelp"></div>
    </div>
  </div>

  <!-- Voice cloning -->
  <div class="card">
    <h5 data-t="cloneTitle"></h5>
    <div class="muted" data-t="cloneHelp"></div>
    <ol class="muted" style="margin:6px 0; padding-inline-start: 20px">
      <li data-t="cloneStep1"></li><li data-t="cloneStep2"></li><li data-t="cloneStep3"></li>
    </ol>
    <div class="row-flex">
      <input id="cloneName" type="text" class="form-control grow" data-ph="cloneName">
      <input id="cloneFiles" type="file" accept="audio/*" multiple class="form-control grow">
      <button id="cloneBtn" class="btn btn-sm btn-primary" data-t="cloneBtn"></button>
    </div>
    <div id="cloneList" style="margin-top:8px"></div>
  </div>

  <!-- Webhook + advanced -->
  <div class="card">
    <details>
      <summary data-t="webhookTitle"></summary>
      <div class="muted" style="margin:6px 0" data-t="webhookHelp"></div>
      <div class="form-check">
        <input id="whEnabled" type="checkbox" class="form-check-input">
        <label for="whEnabled" class="form-check-label" data-t="enable"></label>
      </div>
      <div class="row-flex" style="margin-top:6px">
        <div class="grow"><label data-t="port"></label><input id="whPort" type="number" class="form-control" min="1024" max="65535"></div>
        <div class="grow"><label data-t="token"></label><input id="whToken" type="text" class="form-control" autocomplete="off"></div>
      </div>
      <div class="muted" id="whExample" dir="ltr" style="margin-top:6px; word-break: break-all;"></div>
    </details>
    <details style="margin-top:10px">
      <summary data-t="advancedTitle"></summary>
      <div class="form-check" style="margin-top:6px">
        <input id="restoreVolume" type="checkbox" class="form-check-input">
        <label for="restoreVolume" class="form-check-label" data-t="restoreVolume"></label>
      </div>
      <div class="form-check">
        <input id="pregenerate" type="checkbox" class="form-check-input">
        <label for="pregenerate" class="form-check-label" data-t="pregenerate"></label>
      </div>
      <label data-t="cacheDays" style="margin-top:6px"></label>
      <input id="cacheDays" type="number" class="form-control" min="1">
      <label data-t="repeatGuard" style="margin-top:6px"></label>
      <input id="repeatGuardSeconds" type="number" class="form-control" min="0" max="600">
      <label data-t="pythonPath" style="margin-top:6px"></label>
      <input id="pythonPath" type="text" class="form-control" dir="ltr" placeholder="/path/to/python">
    </details>
  </div>

  <div class="muted" style="text-align:center">
    <span data-t="saveHint"></span> ·
    <a href="https://github.com/orenasher/homebridge-homepod-israel-hebrew" target="_blank" data-t="guide"></a> ·
    <a href="https://paypal.me/orenasher" target="_blank">☕ PayPal</a>
  </div>
</div>

      const vv = el.querySelector('[data-volv]');
      useVol.addEventListener('change', () => {
        range.disabled = !useVol.checked;
        if (useVol.checked) { p.volume = Number(range.value); vv.textContent = range.value; } else { delete p.volume; vv.textContent = ''; }
        save();
      });
      range.addEventListener('input', () => { p.volume = Number(range.value); vv.textContent = range.value; save(); });
      const urg = el.querySelector('[data-k=urgent]');
      urg.addEventListener('change', () => { if (urg.checked) p.urgent = true; else delete p.urgent; el.classList.toggle('urgent', urg.checked); save(); });
      el.classList.toggle('urgent', !!p.urgent);
      el.querySelector('[data-act=del]').addEventListener('click', () => { cfg.phrases.splice(i, 1); save(); renderPhrases(); });
      el.querySelector('[data-act=test]').addEventListener('click', (e) => playTest(p.text, p.voice, p.speakers, p.volume, e.target, p.style, p.urgent));
    });
  }
  $('addPhraseBtn').addEventListener('click', () => {
    const fresh = { text: '' };
    newPhrases.add(fresh);
    cfg.phrases.push(fresh);
    save(); renderPhrases();
    const areas = $('phrases').querySelectorAll('textarea');
    if (areas.length) areas[areas.length - 1].focus();
  });

  /* ---------- premium, webhook, advanced ---------- */
  const bind = (id, get, set, ev = 'change') => { const el = $(id); get(el); el.addEventListener(ev, () => { set(el); save(); renderWebhookExample(); }); };
  bind('elKey', (el) => { el.value = cfg.tts.elevenlabsApiKey || ''; }, (el) => { cfg.tts.elevenlabsApiKey = el.value.trim(); });
  bind('elVoice', (el) => { el.value = cfg.tts.elevenlabsVoiceId || ''; }, (el) => { cfg.tts.elevenlabsVoiceId = el.value.trim(); });
  bind('gKey', (el) => { el.value = cfg.tts.googleApiKey || ''; }, (el) => { cfg.tts.googleApiKey = el.value.trim(); });
  bind('oaKey', (el) => { el.value = cfg.tts.openaiApiKey || ''; }, (el) => { cfg.tts.openaiApiKey = el.value.trim(); });
  bind('caKey', (el) => { el.value = cfg.tts.cartesiaApiKey || ''; }, (el) => { cfg.tts.cartesiaApiKey = el.value.trim(); });
  bind('geminiKey', (el) => { el.value = cfg.tts.geminiApiKey || ''; }, (el) => { cfg.tts.geminiApiKey = el.value.trim(); });
  bind('fallback', (el) => { el.checked = cfg.tts.fallback !== false; }, (el) => { cfg.tts.fallback = el.checked; });
  bind('whEnabled', (el) => { el.checked = !!cfg.webhook.enabled; }, (el) => { cfg.webhook.enabled = el.checked; });
  bind('whPort', (el) => { el.value = cfg.webhook.port || 8095; }, (el) => { cfg.webhook.port = Number(el.value) || 8095; });
  bind('whToken', (el) => { el.value = cfg.webhook.token || ''; }, (el) => { cfg.webhook.token = el.value.trim(); });
  const showGroup = () => { $('groupBox').style.display = cfg.groupSwitches ? '' : 'none'; };
  bind('groupSwitches', (el) => { el.checked = !!cfg.groupSwitches; showGroup(); }, (el) => { cfg.groupSwitches = el.checked; showGroup(); });
  bind('groupName', (el) => { el.placeholder = 'קבצי הקול שלי'; el.value = cfg.groupName || ''; }, (el) => { const v = el.value.trim(); if (v) cfg.groupName = v; else delete cfg.groupName; });
  bind('restoreVolume', (el) => { el.checked = cfg.restoreVolume !== false; }, (el) => { cfg.restoreVolume = el.checked; });
  bind('pregenerate', (el) => { el.checked = cfg.pregenerate !== false; }, (el) => { cfg.pregenerate = el.checked; });
  bind('repeatGuardSeconds', (el) => { el.value = cfg.repeatGuardSeconds ?? 10; }, (el) => { const n = Number(el.value); if (Number.isFinite(n) && n >= 0) cfg.repeatGuardSeconds = Math.min(600, Math.round(n)); else delete cfg.repeatGuardSeconds; });
  bind('cacheDays', (el) => { el.value = cfg.cacheDays || 90; }, (el) => { cfg.cacheDays = Number(el.value) || 90; });
  for (const id of ['elKey', 'gKey', 'oaKey', 'caKey', 'geminiKey']) $(id).addEventListener('change', () => refreshVoiceSelects());
  // quiet hours
  const q = () => { cfg.quietHours = cfg.quietHours || {}; return cfg.quietHours; };
  const showQuiet = () => {
    const on = !!(cfg.quietHours && cfg.quietHours.enabled);
    $('qBox').style.display = on ? '' : 'none';
    $('qVolWrap').style.display = (cfg.quietHours && cfg.quietHours.mode === 'mute') ? 'none' : '';
  };
  bind('qEnabled', (el) => { el.checked = !!(cfg.quietHours && cfg.quietHours.enabled); showQuiet(); }, (el) => { q().enabled = el.checked; showQuiet(); });
  bind('qStart', (el) => { el.value = (cfg.quietHours && cfg.quietHours.start) || '22:00'; }, (el) => { q().start = el.value || '22:00'; });
  bind('qEnd', (el) => { el.value = (cfg.quietHours && cfg.quietHours.end) || '07:00'; }, (el) => { q().end = el.value || '07:00'; });
  bind('qMode', (el) => { el.value = (cfg.quietHours && cfg.quietHours.mode) || 'lower'; }, (el) => { q().mode = el.value; showQuiet(); });
  bind('qVolume', (el) => { el.value = (cfg.quietHours && cfg.quietHours.volume) ?? 25; $('qVolV').textContent = el.value; },
    (el) => { q().volume = Number(el.value); $('qVolV').textContent = el.value; }, 'input');
  // chime
  const ch = () => { cfg.chime = cfg.chime || {}; return cfg.chime; };
  const showChime = () => { $('cBox').style.display = (cfg.chime && cfg.chime.enabled) ? '' : 'none'; };
  bind('cEnabled', (el) => { el.checked = !!(cfg.chime && cfg.chime.enabled); showChime(); }, (el) => { ch().enabled = el.checked; showChime(); });
  bind('cSound', (el) => { el.value = (cfg.chime && cfg.chime.sound) || 'dingdong'; }, (el) => { ch().sound = el.value; });
  bind('cUrgent', (el) => { el.value = (cfg.chime && cfg.chime.urgentSound) || 'urgent'; }, (el) => { ch().urgentSound = el.value; });
  $('cTest').addEventListener('click', (e) => playTest(t('chimeSample'), cfg.voice, [cfg.speakers[0] && cfg.speakers[0].name].filter(Boolean), undefined, e.target, cfg.style));
  // availability sensor
  const av = () => { cfg.availability = cfg.availability || {}; return cfg.availability; };
  const showAv = () => { $('aBox').style.display = (cfg.availability && cfg.availability.enabled) ? '' : 'none'; };
  bind('aEnabled', (el) => { el.checked = !!(cfg.availability && cfg.availability.enabled); showAv(); }, (el) => { av().enabled = el.checked; showAv(); });
  bind('aInterval', (el) => { el.value = (cfg.availability && cfg.availability.intervalMinutes) || 5; },
    (el) => { const n = Math.round(Number(el.value)); av().intervalMinutes = Number.isFinite(n) ? Math.max(1, Math.min(60, n)) : 5; });
  bind('pythonPath', (el) => { el.value = cfg.pythonPath || ''; }, (el) => { const v = el.value.trim(); if (v) cfg.pythonPath = v; else delete cfg.pythonPath; refreshState(); });

  /* ---------- Cartesia voices ---------- */
  function refreshVoiceSelects() {
    renderVoiceSelect($('defaultVoice'), cfg.voice, false);
    renderPhrases();
  }
  function renderCartesiaList(found) {
    const box = $('caList');
    const mine = cfg.tts.cartesiaVoices || [];
    const list = found || mine;
    if (!list.length) { box.innerHTML = found ? `<div class="muted">${esc(t('caNone'))}</div>` : ''; return; }
    box.innerHTML = list.map((v, i) => {
      const has = mine.some((m) => m.id === v.id);
      return `<div class="scan-item"><div>${v.gender === 'f' ? '👩' : v.gender === 'm' ? '👨' : '🎙️'} <b>${esc(v.name)}</b> <span class="muted">${esc(v.description || '')}</span></div>
        <button class="btn btn-sm ${has ? 'btn-outline-danger' : 'btn-outline-primary'}" data-ci="${i}">${esc(has ? t('remove') : t('add'))}</button></div>`;
    }).join('');
    box.querySelectorAll('[data-ci]').forEach((b) => b.addEventListener('click', () => {
      const v = list[Number(b.dataset.ci)];
      cfg.tts.cartesiaVoices = (cfg.tts.cartesiaVoices || []).filter((m) => m.id !== v.id);
      if (b.textContent === t('add')) cfg.tts.cartesiaVoices.push({ id: v.id, name: v.name, gender: v.gender });
      if (!cfg.tts.cartesiaVoices.length) delete cfg.tts.cartesiaVoices;
      save(); renderCartesiaList(found); refreshVoiceSelects();
    }));
  }
  $('caLoad').addEventListener('click', async (e) => {
    if (!cfg.tts.cartesiaApiKey) return homebridge.toast.warning(t('caNeedKey'));
    e.target.disabled = true;
    homebridge.showSpinner();
    try {
      renderCartesiaList(await homebridge.request('/cartesia-voices', { apiKey: cfg.tts.cartesiaApiKey }));
    } catch (err) {
      homebridge.toast.error(err.message || String(err));
    } finally {
      homebridge.hideSpinner(); e.target.disabled = false;
    }
  });

  /* ---------- voice cloning ---------- */
  function renderClones() {
    const box = $('cloneList');
    const list = cfg.tts.clones || [];
    box.innerHTML = list.map((c, i) => `<div class="scan-item"><div>🎤 <b>${esc(c.name)}</b></div>
      <button class="btn btn-sm btn-outline-danger" data-cl="${i}">${esc(t('remove'))}</button></div>`).join('');
    box.querySelectorAll('[data-cl]').forEach((b) => b.addEventListener('click', () => {
      list.splice(Number(b.dataset.cl), 1);
      if (!list.length) delete cfg.tts.clones;
      save(); renderClones(); refreshVoiceSelects();
    }));
  }
  const readFile = (f) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res({ name: f.name, type: f.type, data: String(r.result).split(',')[1] || '' });
    r.onerror = () => rej(r.error);
    r.readAsDataURL(f);
  });
  $('cloneBtn').addEventListener('click', async (e) => {
    if (!cfg.tts.elevenlabsApiKey) return homebridge.toast.warning(t('cloneNeedKey'));
    const files = [...$('cloneFiles').files];
    if (!files.length) return homebridge.toast.warning(t('cloneNeedFile'));
    const name = $('cloneName').value.trim() || t('cloneDefaultName');
    e.target.disabled = true;
    homebridge.showSpinner();
    try {
      const payload = await Promise.all(files.map(readFile));
      const r = await homebridge.request('/clone', { apiKey: cfg.tts.elevenlabsApiKey, name, files: payload });
      cfg.tts.clones = [...(cfg.tts.clones || []), { id: r.id, name: r.name }];
      save(); renderClones(); refreshVoiceSelects();
      homebridge.toast.success(t('cloneDone'));
      $('cloneFiles').value = ''; $('cloneName').value = '';
    } catch (err) {
      homebridge.toast.error(err.message || String(err));
    } finally {
      homebridge.hideSpinner(); e.target.disabled = false;
    }
  });

  function renderWebhookExample() {
    const port = cfg.webhook.port || 8095;
    const tok = cfg.webhook.token ? `&token=${encodeURIComponent(cfg.webhook.token)}` : '';
    $('whExample').textContent = `http://<Homebridge-IP>:${port}/say?text=${encodeURIComponent(lang === 'he' ? 'שלום' : 'Hello')}${tok}`;
  }

  /* ---------- what's new ---------- */
  let version = '';
  try { version = (await homebridge.request('/version')).version || ''; } catch { /* older backend */ }
  const SEEN_KEY = 'hih-whats-new-seen';
  function renderWhatsNew() {
    const notes = WHATS_NEW[version];
    let seen = '';
    try { seen = localStorage.getItem(SEEN_KEY) || ''; } catch { /* storage blocked */ }
    if (!notes || seen === version) { $('whatsNew').style.display = 'none'; return; }
    $('wnTitle').textContent = `${t('wnTitle')} ${version}`;
    $('wnList').innerHTML = (notes[lang] || notes.he).map((n) => `<li>${esc(n)}</li>`).join('');
    $('whatsNew').style.display = '';
  }
  $('wnOk').addEventListener('click', () => {
    try { localStorage.setItem(SEEN_KEY, version); } catch { /* storage blocked */ }
    $('whatsNew').style.display = 'none';
  });
  const applyLangBase = applyLang;
  applyLang = () => { applyLangBase(); renderWhatsNew(); };

  save();
  applyLang();
})();
</script>
